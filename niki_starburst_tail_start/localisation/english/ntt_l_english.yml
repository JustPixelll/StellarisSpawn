l_english:
 ntt.10.name:0 "A Home at the End of the Stars (v0.1.2)"
 ntt.10.desc:0 "Your starting cluster now connects to [event_target:ntt_tail.GetName], [Root.ntt_diag_depth] hyperlane jumps from the inner region used for tail selection.\n\nThe next-day check confirmed the capital position, the original internal hyperlanes of [Root.ntt_diag_cluster] systems and exactly [Root.ntt_diag_exits] exit to the wider galaxy.\n\nHome distance from the galactic centre: [Root.ntt_diag_home_before]% before, [Root.ntt_diag_home_after]% after. Press H to centre on your capital.\n\nThis remains experimental. Check the Mindwardens story systems, fleets and quest before continuing."
 ntt.11.name:0 "No Suitable Tail Found (v0.1.2)"
 ntt.11.desc:0 "No suitable unoccupied tail passed the placement checks. No systems or hyperlanes have been changed.\n\nv0.1.2 scan:\nMain galaxy: [Root.ntt_diag_main]\nOuter region: [Root.ntt_diag_outer]\nUnoccupied: [Root.ntt_diag_empty]\nNo aura or hostile fleet: [Root.ntt_diag_clear]\nFar enough from old start: [Root.ntt_diag_candidates]\nMaximum radius (%): [Root.ntt_diag_radius_percent]\n\nSend this complete message when reporting the issue. You can also try another new Starburst galaxy."
 ntt.12.name:0 "This Start Cannot Be Relocated (v0.1.2)"
 ntt.12.desc:0 "This start is outside the supported layout: a nomadic or linked-empire origin, an unusually large starter cluster (over 24 systems), or no suitable connected main galaxy. No systems or hyperlanes have been changed.\n\nChoose a different empire or generate another Starburst galaxy."
 ntt.13.name:0 "Placement Incomplete - Start a New Galaxy (v0.1.2)"
 ntt.13.desc:0 "The engine could not place every starter system near the tail. Some systems have moved, so this galaxy should be discarded.\n\nReturn to the main menu and generate a new game. Please retain logs/error.log and logs/game.log if reporting this issue."
 ntt.14.name:0 "Starting System Could Not Be Placed (v0.1.2)"
 ntt.14.desc:0 "The home-system move did not pass its position check. Companion systems have not been moved.\n\nReturn to the main menu and generate another new Starburst galaxy."
 ntt.ok:0 "Understood"
 ntt.15.name:0 "Relocation Verification Failed (v0.1.2)"
 ntt.15.desc:0 "The next-day check could not confirm the capital position or the expected hyperlanes. The map has already been modified; do not continue this run.\n\nChecked systems: [Root.ntt_diag_cluster]\nExternal connections: [Root.ntt_diag_exits] (expected: 1)\n\nReload your backup or start a new galaxy. Retain the save and logs/error.log and logs/game.log for a bug report."
