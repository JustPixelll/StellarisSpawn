l_german:
 ntt.10.name:0 "Eine Heimat am Ende der Sterne (v0.1.2)"
 ntt.10.desc:0 "Deine Startgruppe ist jetzt mit [event_target:ntt_tail.GetName] verbunden, [Root.ntt_diag_depth] Hyperraumspruenge von der fuer die Auswahl verwendeten inneren Region entfernt.\n\nDie Pruefung am Folgetag bestaetigte die Position der Hauptstadt, die internen Routen von [Root.ntt_diag_cluster] Systemen und genau [Root.ntt_diag_exits] Verbindung zur restlichen Galaxie.\n\nEntfernung der Heimat vom Zentrum: vorher [Root.ntt_diag_home_before]%, nachher [Root.ntt_diag_home_after]%. Druecke H fuer deine Hauptstadt.\n\nDiese Mod bleibt experimentell. Pruefe die Mindwardens-Systeme, Flotten und Quest, bevor du weiterspielst."
 ntt.11.name:0 "Kein geeigneter Arm gefunden (v0.1.2)"
 ntt.11.desc:0 "Kein geeignetes unbesetztes Ziel hat die Pruefungen bestanden. Systeme und Hyperraumrouten wurden nicht veraendert.\n\nv0.1.2 Diagnose:\nHauptgalaxie: [Root.ntt_diag_main]\nAeussere Region: [Root.ntt_diag_outer]\nUnbesetzt: [Root.ntt_diag_empty]\nOhne Aura oder feindliche Flotte: [Root.ntt_diag_clear]\nWeit genug vom alten Start: [Root.ntt_diag_candidates]\nMaximaler Radius (%): [Root.ntt_diag_radius_percent]\n\nSende bei einer Fehlermeldung diesen vollstaendigen Text. Du kannst auch eine neue Starburst-Galaxie erstellen."
 ntt.12.name:0 "Dieser Start kann nicht versetzt werden (v0.1.2)"
 ntt.12.desc:0 "Dieser Start wird nicht unterstuetzt: nomadischer oder mit anderen Reichen verknuepfter Ursprung, eine Startgruppe mit mehr als 24 Systemen oder keine geeignete Hauptgalaxie. Systeme und Hyperraumrouten wurden nicht veraendert.\n\nWaehle ein anderes Reich oder erstelle eine neue Starburst-Galaxie."
 ntt.13.name:0 "Platzierung unvollstaendig - Neu starten (v0.1.2)"
 ntt.13.desc:0 "Die Spielengine konnte nicht alle Startsysteme am Ziel platzieren. Einige Systeme wurden bereits versetzt. Bitte verwirf diese neue Galaxie.\n\nKehre ins Hauptmenue zurueck und starte ein neues Spiel. Sichere bei einer Fehlermeldung logs/error.log und logs/game.log."
 ntt.14.name:0 "Heimatsystem konnte nicht platziert werden (v0.1.2)"
 ntt.14.desc:0 "Die Positionspruefung des Heimatsystems ist fehlgeschlagen. Die Nachbarsysteme wurden nicht versetzt.\n\nKehre ins Hauptmenue zurueck und erstelle eine neue Starburst-Galaxie."
 ntt.ok:0 "Verstanden"
 ntt.15.name:0 "Pruefung der Versetzung fehlgeschlagen (v0.1.2)"
 ntt.15.desc:0 "Die Pruefung am Folgetag konnte Position oder Hyperraumrouten nicht bestaetigen. Die Karte wurde bereits veraendert. Spiele diesen Stand nicht weiter.\n\nGepruefte Systeme: [Root.ntt_diag_cluster]\nExterne Verbindungen: [Root.ntt_diag_exits] (erwartet: 1)\n\nLade deine Sicherung oder starte eine neue Galaxie. Sichere Spielstand, logs/error.log und logs/game.log fuer einen Fehlerbericht."
