l_english:
 ntt.10.name:0 "A Home at the End of the Stars (v0.1.1)"
 ntt.10.desc:0 "Your starting system and its nearby cluster have been placed near the outer end of a Starburst tail. The cluster retains its internal hyperlanes and has one connection to the wider galaxy through your home system.\n\nThe original systems, planets and empires have been retained. Press H to return to your capital if the camera is still looking at the old location.\n\nThis is an experimental mod. Check your origin systems and starting fleets before continuing."
 ntt.11.name:0 "No Suitable Tail Found (v0.1.1)"
 ntt.11.desc:0 "No suitable unoccupied tail passed the placement checks. No systems or hyperlanes have been changed.\n\nv0.1.1 scan:\nMain galaxy: [Root.ntt_diag_main]\nOuter region: [Root.ntt_diag_outer]\nUnoccupied: [Root.ntt_diag_empty]\nNo aura or hostile fleet: [Root.ntt_diag_clear]\nFar enough from old start: [Root.ntt_diag_candidates]\nMaximum radius (%): [Root.ntt_diag_radius]\n\nSend this complete message when reporting the issue. You can also try another new Starburst galaxy."
 ntt.12.name:0 "This Start Cannot Be Relocated (v0.1.1)"
 ntt.12.desc:0 "This start is outside the supported layout: a nomadic or linked-empire origin, an unusually large starter cluster (over 24 systems), or no suitable connected main galaxy. No systems or hyperlanes have been changed.\n\nChoose a different empire or generate another Starburst galaxy."
 ntt.13.name:0 "Placement Incomplete - Start a New Galaxy (v0.1.1)"
 ntt.13.desc:0 "The engine could not place every starter system near the tail. Some systems have moved, so this galaxy should be discarded.\n\nReturn to the main menu and generate a new game. Please retain logs/error.log and logs/game.log if reporting this issue."
 ntt.14.name:0 "Starting System Could Not Be Placed (v0.1.1)"
 ntt.14.desc:0 "The home-system move did not pass its position check. Companion systems have not been moved.\n\nReturn to the main menu and generate another new Starburst galaxy."
 ntt.ok:0 "Understood"
