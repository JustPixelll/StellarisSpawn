l_german:
 ntt.10.name:0 "Eine Heimat am Ende der Sterne"
 ntt.10.desc:0 "Dein Heimatsystem und seine nahe Umgebung wurden an das aeussere Ende eines Starburst-Arms versetzt. Die internen Hyperraumrouten bleiben erhalten. Das Heimatsystem verbindet die Gruppe mit der restlichen Galaxie.\n\nSysteme, Planeten und Reiche bleiben erhalten. Druecke H, falls die Kamera noch die alte Position zeigt.\n\nDies ist eine experimentelle Mod. Pruefe Ursprungssysteme und Startflotten, bevor du weiterspielst."
 ntt.11.name:0 "Kein geeigneter Arm gefunden"
 ntt.11.desc:0 "In dieser Galaxie gibt es innerhalb der Platzierungsgrenzen kein geeignetes, weit entferntes und unbesetztes Ziel. Es wurden keine Systeme oder Hyperraumrouten veraendert.\n\nErstelle eine neue Starburst-Galaxie."
 ntt.12.name:0 "Dieser Start kann nicht versetzt werden"
 ntt.12.desc:0 "Dieser Start wird nicht unterstuetzt: nomadischer oder mit anderen Reichen verknuepfter Ursprung, eine Startgruppe mit mehr als 24 Systemen oder keine geeignete Hauptgalaxie. Systeme und Hyperraumrouten wurden nicht veraendert.\n\nWaehle ein anderes Reich oder erstelle eine neue Starburst-Galaxie."
 ntt.13.name:0 "Platzierung unvollstaendig - Neu starten"
 ntt.13.desc:0 "Die Spielengine konnte nicht alle Startsysteme am Ziel platzieren. Einige Systeme wurden bereits versetzt. Bitte verwirf diese neue Galaxie.\n\nKehre ins Hauptmenue zurueck und starte ein neues Spiel. Sichere bei einer Fehlermeldung logs/error.log und logs/game.log."
 ntt.14.name:0 "Heimatsystem konnte nicht platziert werden"
 ntt.14.desc:0 "Die Positionspruefung des Heimatsystems ist fehlgeschlagen. Die Nachbarsysteme wurden nicht versetzt.\n\nKehre ins Hauptmenue zurueck und erstelle eine neue Starburst-Galaxie."
 ntt.ok:0 "Verstanden"
